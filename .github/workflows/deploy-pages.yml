name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not `npm ci`): the lockfile is generated on macOS and omits
      # some Linux-only optional deps (@emnapi/*), which makes strict `npm ci` fail.
      - run: npm install --no-audit --no-fund
      # Custom domain (soundbathvibrations.com) serves at the root, so no
      # PAGES_BASE_PATH — the site builds without a basePath.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
